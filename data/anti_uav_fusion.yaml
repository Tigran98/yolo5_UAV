# YOLOv5 🚀 Fusion Model Dataset Configuration
# Anti-UAV Dataset with RGB + IR modalities

# Dataset path (relative to yolov5 root)
path: ../yolov8_nano_ssd/data/anti-uav

# Train/val/test image directories  
train: images/train
val: images/val
test: images/test-2

# Number of classes
nc: 1

# Class names
names:
  0: drone

# Notes:
# - Images are named with "_visible_" (RGB) and "_infrared_" (IR) keywords
# - DualModalDataset will automatically pair RGB and IR images
# - Labels are in YOLO format: labels/train/{image_stem}.txt
# - Each line in label file: class x_center y_center width height (normalized 0-1)
